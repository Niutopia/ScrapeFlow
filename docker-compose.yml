name: scrapeflow

services:
  alist:
    image: xhofe/alist:v3.62.0
    restart: unless-stopped
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    ports:
      - "127.0.0.1:${SCRAPEFLOW_ALIST_PORT:-5244}:5244"
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/alist-data:/opt/alist/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5244/api/public/settings"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${SCRAPEFLOW_API_IMAGE:-scrapeflow-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    command: ["python3", "-m", "local.simple_server"]
    environment:
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: ${ALIST_USERNAME:-}
      ALIST_PASSWORD: ${ALIST_PASSWORD:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-zh-CN}
      # Namespaced on purpose: an ambient host HTTP_PROXY almost always points
      # at host loopback, which resolves to the container itself and silently
      # breaks every egress call (TMDB, magnet indexes) while health still
      # reports "configured".  Only an explicit SCRAPEFLOW_* value is used.
      HTTP_PROXY: ${SCRAPEFLOW_HTTP_PROXY:-}
      HTTPS_PROXY: ${SCRAPEFLOW_HTTPS_PROXY:-}
      NO_PROXY: "alist,pansou,localhost,127.0.0.1${NO_PROXY:+,}${NO_PROXY:-}"
      SCRAPEFLOW_API_HOST: 0.0.0.0
      SCRAPEFLOW_STATE_DIR: /data
      SCRAPEFLOW_MIN_VIDEO_BYTES: ${SCRAPEFLOW_MIN_VIDEO_BYTES:-1048576}
      # These safety ceilings are independent of ordinary archive limits.
      # One remote ISO is first staged under /data, then only selected members
      # are extracted there; both boundaries fresh-check free disk space.
      SCRAPEFLOW_ARCHIVE_MIN_FREE_BYTES: ${SCRAPEFLOW_ARCHIVE_MIN_FREE_BYTES:-2147483648}
      SCRAPEFLOW_DISC_IMAGE_MAX_SOURCE_BYTES: ${SCRAPEFLOW_DISC_IMAGE_MAX_SOURCE_BYTES:-68719476736}
      SCRAPEFLOW_DISC_IMAGE_MAX_EXPANDED_BYTES: ${SCRAPEFLOW_DISC_IMAGE_MAX_EXPANDED_BYTES:-68719476736}
      SCRAPEFLOW_DISC_IMAGE_MAX_MEMBER_BYTES: ${SCRAPEFLOW_DISC_IMAGE_MAX_MEMBER_BYTES:-68719476736}
      SCRAPEFLOW_DISC_IMAGE_MAX_EXPANSION_RATIO: ${SCRAPEFLOW_DISC_IMAGE_MAX_EXPANSION_RATIO:-4}
      SCRAPEFLOW_DISC_IMAGE_COMMAND_TIMEOUT_SECONDS: ${SCRAPEFLOW_DISC_IMAGE_COMMAND_TIMEOUT_SECONDS:-5400}
      SCRAPEFLOW_MEDIA_ROOT: /quark/影视
      SCRAPEFLOW_QUARK_HELPER_URL: ${SCRAPEFLOW_QUARK_HELPER_URL:-http://127.0.0.1:18765}
      SCRAPEFLOW_QUARK_HELPER_TOKEN: ${SCRAPEFLOW_QUARK_HELPER_TOKEN:-}
      SCRAPEFLOW_PANSOU_ENABLED: ${SCRAPEFLOW_PANSOU_ENABLED:-0}
      SCRAPEFLOW_PANSOU_URL: ${SCRAPEFLOW_PANSOU_URL:-}
      SCRAPEFLOW_PANSOU_TOKEN: ${SCRAPEFLOW_PANSOU_TOKEN:-}
      SCRAPEFLOW_PANSOU_TIMEOUT: ${SCRAPEFLOW_PANSOU_TIMEOUT:-12}
      SCRAPEFLOW_PANSOU_MAX_QUERIES: ${SCRAPEFLOW_PANSOU_MAX_QUERIES:-4}
      SCRAPEFLOW_PANSOU_MAX_LINKS: ${SCRAPEFLOW_PANSOU_MAX_LINKS:-64}
      SCRAPEFLOW_REQUIRED_SUBTITLE_LANGUAGE: ${SCRAPEFLOW_REQUIRED_SUBTITLE_LANGUAGE:-zh}
      SCRAPEFLOW_SUBTITLE_PROVIDER_ENABLED: ${SCRAPEFLOW_SUBTITLE_PROVIDER_ENABLED:-0}
      SCRAPEFLOW_OPENSUBTITLES_API_KEY: ${SCRAPEFLOW_OPENSUBTITLES_API_KEY:-}
      SCRAPEFLOW_REPLENISHMENT_ANIMETOSHO_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_ANIMETOSHO_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_TOKYOTOSHO_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_TOKYOTOSHO_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_SUBSPLEASE_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_SUBSPLEASE_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_MIKAN_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_MIKAN_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_DMHY_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_DMHY_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_NYAA_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_NYAA_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_ACG_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_ACG_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_DYNAMIC_SEARCH_TIMEOUT: ${SCRAPEFLOW_REPLENISHMENT_DYNAMIC_SEARCH_TIMEOUT:-45}
      SCRAPEFLOW_REPLENISHMENT_BT_IDLE_TIMEOUT: ${SCRAPEFLOW_REPLENISHMENT_BT_IDLE_TIMEOUT:-120}
      SCRAPEFLOW_REPLENISHMENT_TORRENT_TIMEOUT: ${SCRAPEFLOW_REPLENISHMENT_TORRENT_TIMEOUT:-900}
      TMDB_BASE_URL: ${TMDB_BASE_URL_DOCKER:-https://api.themoviedb.org/3}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL_DOCKER:-}
      TZ: ${TZ:-Asia/Shanghai}
      TMPDIR: /var/tmp/scrapeflow
    depends_on:
      alist:
        condition: service_healthy
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/scrapeflow-data:/data
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/api-temp:/var/tmp/scrapeflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SCRAPEFLOW_API_PORT:-3010}:8765"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"]
      interval: 10s
      timeout: 4s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # First-tier share index.  It is a read-only search source only: it never
  # sees the media root, never writes anything, and the API still refuses to
  # trust a row until the delegated Quark session has listed the real share.
  # No published port — the API reaches it on the Compose network alone.
  pansou:
    image: ghcr.io/fish2018/pansou:latest
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PROXY: ${SCRAPEFLOW_HTTP_PROXY:-}
      HTTPS_PROXY: ${SCRAPEFLOW_HTTPS_PROXY:-}
      NO_PROXY: "alist,api,localhost,127.0.0.1${NO_PROXY:+,}${NO_PROXY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  quark-helper:
    image: ${SCRAPEFLOW_API_IMAGE:-scrapeflow-api:local}
    restart: unless-stopped
    init: true
    command: ["python3", "scripts/scrapeflow_quark_helper.py", "--docker-sidecar"]
    environment:
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: ${ALIST_USERNAME:-}
      ALIST_PASSWORD: ${ALIST_PASSWORD:-}
      SCRAPEFLOW_MEDIA_ROOT: /quark/影视
      NO_PROXY: "alist,localhost,127.0.0.1${NO_PROXY:+,}${NO_PROXY:-}"
      # The Helper's own Quark HTTPS follows the same proxy the API search
      # layer uses (a distinct egress avoids the per-IP burst correlation
      # with AList's direct Quark traffic); CDP discovery stays direct via
      # the explicit docker-sidecar URL below.
      HTTP_PROXY: ${SCRAPEFLOW_HTTP_PROXY:-}
      HTTPS_PROXY: ${SCRAPEFLOW_HTTPS_PROXY:-}
      SCRAPEFLOW_QUARK_HELPER_TOKEN: ${SCRAPEFLOW_QUARK_HELPER_TOKEN:-}
      SCRAPEFLOW_QUARK_HELPER_CDP_URL: http://host.docker.internal:19222/json/list
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_started
        restart: true
    network_mode: service:api
    logging:
      options:
        max-size: "10m"
        max-file: "3"
