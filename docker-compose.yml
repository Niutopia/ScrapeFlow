name: scrapeflow

services:
  alist:
    image: xhofe/alist:v3.62.0
    restart: unless-stopped
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    ports:
      - "127.0.0.1:5244:5244"
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/alist-data:/opt/alist/data
      - ./.runtime/alist-temp:/opt/alist/data/temp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5244/api/public/settings"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: scrapeflow-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    command: ["python3", "-m", "local.simple_server"]
    env_file:
      - .env.local
    environment:
      ALIST_URL: http://alist:5244
      SCRAPEFLOW_API_HOST: 0.0.0.0
      SCRAPEFLOW_STATE_DIR: /data
      SCRAPEFLOW_MEDIA_ROOT: ${SCRAPEFLOW_MEDIA_ROOT:-/quark/影视}
      TMDB_BASE_URL: ${TMDB_BASE_URL_DOCKER:-https://api.themoviedb.org/3}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL_DOCKER:-}
      SCRAPEFLOW_START_PAUSED: ${SCRAPEFLOW_START_PAUSED:-0}
      TZ: ${TZ:-Asia/Shanghai}
      TMPDIR: /var/tmp/scrapeflow
    depends_on:
      alist:
        condition: service_healthy
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/scrapeflow-data:/data
      - ./.runtime/api-temp:/var/tmp/scrapeflow
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"]
      interval: 10s
      timeout: 4s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: scrapeflow-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCRAPEFLOW_PORT:-3010}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
