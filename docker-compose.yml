name: scrapeflow

services:
  alist:
    image: xhofe/alist:v3.62.0
    restart: unless-stopped
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
    ports:
      - "127.0.0.1:5244:5244"
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/alist-data:/opt/alist/data
      - ./.runtime/alist-temp:/opt/alist/data/temp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5244/api/public/settings"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: scrapeflow-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    init: true
    command: ["python3", "-m", "local.simple_server"]
    environment:
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: ${ALIST_USERNAME:-}
      ALIST_PASSWORD: ${ALIST_PASSWORD:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-zh-CN}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-alist,localhost,127.0.0.1}
      SCRAPEFLOW_API_HOST: 0.0.0.0
      SCRAPEFLOW_STATE_DIR: /data
      SCRAPEFLOW_BUILD_COMMIT: ${SCRAPEFLOW_BUILD_COMMIT:-}
      SCRAPEFLOW_BUILD_TIME: ${SCRAPEFLOW_BUILD_TIME:-}
      SCRAPEFLOW_MEDIA_ROOT: ${SCRAPEFLOW_MEDIA_ROOT:-/quark/影视}
      SCRAPEFLOW_START_PAUSED: ${SCRAPEFLOW_START_PAUSED:-1}
      SCRAPEFLOW_INTAKE_MONITOR: ${SCRAPEFLOW_INTAKE_MONITOR:-0}
      SCRAPEFLOW_INTAKE_SCAN_SECONDS: ${SCRAPEFLOW_INTAKE_SCAN_SECONDS:-30}
      SCRAPEFLOW_AUTOMATIC_AUDIT: ${SCRAPEFLOW_AUTOMATIC_AUDIT:-0}
      SCRAPEFLOW_AUDIT_AUTO_REPAIR_ENABLED: ${SCRAPEFLOW_AUDIT_AUTO_REPAIR_ENABLED:-0}
      SCRAPEFLOW_PROVIDER_AUTO_REPAIR_ENABLED: ${SCRAPEFLOW_PROVIDER_AUTO_REPAIR_ENABLED:-0}
      SCRAPEFLOW_AUTOMATIC_RETRY_LIMIT: ${SCRAPEFLOW_AUTOMATIC_RETRY_LIMIT:-3}
      SCRAPEFLOW_PROVIDER_RETRY_LIMIT: ${SCRAPEFLOW_PROVIDER_RETRY_LIMIT:-5}
      SCRAPEFLOW_PROVIDER_WORKERS: ${SCRAPEFLOW_PROVIDER_WORKERS:-1}
      SCRAPEFLOW_QUARK_HELPER_URL: ${SCRAPEFLOW_QUARK_HELPER_URL:-http://127.0.0.1:18765}
      SCRAPEFLOW_QUARK_HELPER_TOKEN: ${SCRAPEFLOW_QUARK_HELPER_TOKEN:-}
      SCRAPEFLOW_PANSOU_ENABLED: ${SCRAPEFLOW_PANSOU_ENABLED:-0}
      SCRAPEFLOW_PANSOU_URL: ${SCRAPEFLOW_PANSOU_URL:-}
      SCRAPEFLOW_PANSOU_TOKEN: ${SCRAPEFLOW_PANSOU_TOKEN:-}
      SCRAPEFLOW_PANSOU_TIMEOUT: ${SCRAPEFLOW_PANSOU_TIMEOUT:-12}
      SCRAPEFLOW_PANSOU_MAX_QUERIES: ${SCRAPEFLOW_PANSOU_MAX_QUERIES:-4}
      SCRAPEFLOW_PANSOU_MAX_LINKS: ${SCRAPEFLOW_PANSOU_MAX_LINKS:-64}
      SCRAPEFLOW_PROVIDER_PILOT_TMDB: ${SCRAPEFLOW_PROVIDER_PILOT_TMDB:-}
      SCRAPEFLOW_PROVIDER_PILOT_GAP: ${SCRAPEFLOW_PROVIDER_PILOT_GAP:-}
      SCRAPEFLOW_REQUIRED_SUBTITLE_LANGUAGE: ${SCRAPEFLOW_REQUIRED_SUBTITLE_LANGUAGE:-zh}
      SCRAPEFLOW_TMDB_AUDIT_WORKERS: ${SCRAPEFLOW_TMDB_AUDIT_WORKERS:-4}
      SCRAPEFLOW_SUBTITLE_PROBE_BUDGET_SECONDS: ${SCRAPEFLOW_SUBTITLE_PROBE_BUDGET_SECONDS:-120}
      SCRAPEFLOW_SUBTITLE_PROBE_WORKERS: ${SCRAPEFLOW_SUBTITLE_PROBE_WORKERS:-4}
      SCRAPEFLOW_SUBTITLE_PROBE_MAX_FILES: ${SCRAPEFLOW_SUBTITLE_PROBE_MAX_FILES:-2048}
      SCRAPEFLOW_REPLENISHMENT_ANIMETOSHO_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_ANIMETOSHO_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_TOKYOTOSHO_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_TOKYOTOSHO_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_SUBSPLEASE_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_SUBSPLEASE_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_MIKAN_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_MIKAN_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_DMHY_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_DMHY_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_NYAA_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_NYAA_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_ACG_SEARCH: ${SCRAPEFLOW_REPLENISHMENT_ACG_SEARCH:-0}
      SCRAPEFLOW_REPLENISHMENT_BT_IDLE_TIMEOUT: ${SCRAPEFLOW_REPLENISHMENT_BT_IDLE_TIMEOUT:-120}
      SCRAPEFLOW_REPLENISHMENT_TORRENT_TIMEOUT: ${SCRAPEFLOW_REPLENISHMENT_TORRENT_TIMEOUT:-900}
      TMDB_BASE_URL: ${TMDB_BASE_URL_DOCKER:-https://api.themoviedb.org/3}
      TMDB_PROXY_URL: ${TMDB_PROXY_URL_DOCKER:-}
      TZ: ${TZ:-Asia/Shanghai}
      TMPDIR: /var/tmp/scrapeflow
    depends_on:
      alist:
        condition: service_healthy
    volumes:
      - ${SCRAPEFLOW_HOST_STATE_ROOT:?set SCRAPEFLOW_HOST_STATE_ROOT}/scrapeflow-data:/data
      - ./.runtime/api-temp:/var/tmp/scrapeflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SCRAPEFLOW_API_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"]
      interval: 10s
      timeout: 4s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  quark-helper:
    image: scrapeflow-api:local
    restart: unless-stopped
    init: true
    command: ["python3", "scripts/scrapeflow_quark_helper.py", "--docker-sidecar"]
    environment:
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: ${ALIST_USERNAME:-}
      ALIST_PASSWORD: ${ALIST_PASSWORD:-}
      NO_PROXY: ${NO_PROXY:-alist,localhost,127.0.0.1}
      SCRAPEFLOW_QUARK_HELPER_TOKEN: ${SCRAPEFLOW_QUARK_HELPER_TOKEN:-}
      SCRAPEFLOW_QUARK_HELPER_CDP_URL: http://host.docker.internal:19222/json/list
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_started
        restart: true
    network_mode: service:api
    logging:
      options:
        max-size: "10m"
        max-file: "3"
